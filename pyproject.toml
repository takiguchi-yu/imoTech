[project]
name = "imotech"
version = "0.1.0"
description = "Hacker News の議論を日本語でまとめる自動化パイプライン"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "google-genai>=0.3",
    "pydantic-settings>=2.4",
]

[project.scripts]
imotech = "imotech.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imotech"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
