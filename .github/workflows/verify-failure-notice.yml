name: verify-failure-notice

# 失敗通知（.github/actions/notify-failure）の検証専用。M3 の完了条件
# 「意図的に失敗させて Issue が立つ」「2 回目の失敗でコメントが追記され Issue が増えない」
# を実測するために置いている。**確認が済んだら削除する。**
#
# GEMINI_API_KEY を空で渡して compose を非 0 で終わらせる。Secrets には触らないので
# daily.yml の本番実行に影響しない。compose はキーの確認で止まるため、
# 候補ストアも Gemini も Notion も触らない（src/imotech/cli.py:149-156）。
on: workflow_dispatch

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  verify:
    name: 失敗通知の検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をロックファイル通りに入れる
        run: uv sync --frozen

      - name: 下書きを生成する（キーを渡さないので非 0 で終わる）
        run: uv run imotech compose
        env:
          GEMINI_API_KEY: ""

      - name: 失敗を通知する
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          causes: |
            **これは失敗通知の検証です。** M3 の完了条件を実測するために意図的に失敗させています。
            確認が済んだら `.github/workflows/verify-failure-notice.yml` ごと削除し、この Issue も閉じます。
