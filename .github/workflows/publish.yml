name: publish

on:
  # 毎時 23 分。承認は人の操作なので、いつ来るか分からない。
  # 毎正時を避ける理由は daily.yml と同じ（公式に「High load times include the
  # start of every hour」「some queued jobs may be dropped」と明記されている）
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# commit / push に contents、Issue 起票に issues、
# 失敗したステップ名を実行の記録から読むのに actions を使う
permissions:
  contents: write
  issues: write
  actions: read

# 前の実行を殺さない。Markdown を書いたあとに Notion を Published へ進める順序なので、
# 途中で止めると「書いたのに Approved のまま」が残る（次回が拾えるので害はないが、
# 同じ記事を 2 つの実行が同時に触るのは避ける）
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: 承認の反映
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # shallow clone のまま rebase すると unshallow が要る場面があるので、
          # 安全側に振って全履歴を取る
          fetch-depth: 0

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をロックファイル通りに入れる
        run: uv sync --frozen

      # Gemini は呼ばない。Notion から imo だけを取り出して Markdown に差し込む
      # （記事本文は compose が書いたものが正 — docs/DESIGN.md 3.0b）。
      #
      # 終了コードの意味は src/imotech/cli.py の cmd_publish 末尾を参照。
      # 承認 0 件は 0。1 件でも反映できれば 0（残りは次回が拾う）。
      # 承認があったのに全件飛ばしたときだけ非 0 にする
      - name: 承認された記事を反映する
        run: uv run imotech publish
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # publish が触るのは記事 Markdown だけ。data/candidates.jsonl は書かない
      # （`store.save` は JSONL を全行書き直すため、daily.yml と同時に走ると
      # rebase が行単位で解決できず競合する）。add 対象もそれに合わせる
      - name: 反映を commit して push する
        id: commit
        run: |
          set -euo pipefail

          # 41898282 は github-actions[bot] のユーザー ID
          # （`gh api /users/github-actions%5Bbot%5D` で確認）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/src/content/articles

          # 承認が 0 件の時間帯がほとんど。変更が無いのは失敗ではない
          if git diff --cached --quiet; then
            echo "反映するものはありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # 実行は毎時 23 分（UTC）。履歴を JST で読むので日付も JST で打つ
          git commit -m "chore: publish approved articles ($(TZ=Asia/Tokyo date '+%Y-%m-%d'))"

          # daily.yml が同時に site/ を触りうるので、push 前に取り込む。
          # 取り込んだ直後にさらに push が入ることもあるので数回試す
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase が競合しました。Notion 側は Approved のままなので、" \
                   "競合を解決すれば次回の実行が拾います"
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push が弾かれました。取り込み直します（${attempt} 回目）"
          done
          echo "::error::3 回試しても push できませんでした。Notion 側は Approved の" \
               "ままなので、次回の実行が拾います"
          exit 1

      # ここから Cloudflare へ配る。Workers Builds の Git 連携を使わないのは、
      # Cloudflare 側でビルドが落ちると Actions は成功してしまい、失敗が Issue に
      # 乗らないため（docs/DESIGN.md 5.5）。Cloudflare の月 500 ビルド枠も使わない。
      #
      # 手動実行のときは commit が無くてもデプロイする。デプロイだけが失敗した回の
      # 復旧が、再実行で効くようにするため
      - name: Node をセットアップ
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          # site/package.json の engines に合わせる（型ストリッピングの下限）
          node-version: "22.18"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: サイトをビルドする
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: site
        run: |
          npm ci
          npm run build
        env:
          # 未設定だと astro.config.mjs のガードが落とす。localhost の URL が
          # sitemap と RSS に焼き込まれたまま公開されるのを防ぐため
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Cloudflare にデプロイする
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      # サイトに出たことを確かめてから Notion を進める。
      # ここまで来れば Markdown は main に入っている。もう一度 publish を実行すると、
      # imo が入った記事は already 分岐に落ちて Notion 側だけが Published に進む。
      # 1 回目で進めないのは、push が失敗したときに「Notion は Published なのに
      # Markdown は未コミット」を残さないため（その状態は fetch_approved が
      # 二度と返さないので、その記事は自動では永久に公開されない）
      - name: Notion を Published に進める
        run: uv run imotech publish
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # timeout（10 分）や手動キャンセルでは failure() は真にならない。
      # cancelled() は「ワークフローがキャンセルされたら true」
      # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
      - name: 失敗を通知する
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          causes: |
            上から順に疑う。ログの stderr に、どれに当たったかが出ている。

            - **Secrets が未設定**（ログに「NOTION_TOKEN と NOTION_DATABASE_ID が未設定です」／終了コード 2）
              → Notion を使う運用なら `gh secret set NOTION_TOKEN` と `gh secret set NOTION_DATABASE_ID`。
              Notion を使わない運用に切り替えたのなら **`gh workflow disable publish.yml`** で止める
              （このワークフローは毎時走るので、放置すると毎時この Issue にコメントが積む）
            - **Notion が 403 / 404**（ログに「Notion の呼び出しに失敗しました」）
              → `NOTION_DATABASE_ID` の誤り、トークン失効、インテグレーションが DB に未接続。
              `gh secret list` で更新日を確認する
            - **承認された記事を全件飛ばした**（ログに「すべてを飛ばしました」）
              → ログの `[warn]` 行に記事ごとの理由が出ている。よくあるのは 4 つ:
              (a) Notion 側で `Slug` が書き換えられた、(b) その記事をまだ `compose` していない、
              (c) `## imo` のプレースホルダのコメント行を消し忘れている、
              (d) slug が衝突して `<slug>-<hash6>.md` として保存されている。
              いずれも `Status` は `Approved` のまま残るので、直したら再実行すれば拾える
            - **`git pull --rebase` が競合、または push が 3 回弾かれた**
              → `daily.yml` と同じ記事ファイルを同時に触った。**Notion 側は `Approved` の
              まま**なので取りこぼしは無く、競合を解決すれば次回の実行（毎時 23 分）が拾う。
              急ぐなら `git pull --rebase` して `gh workflow run publish.yml`
            - **ビルドが失敗した**（`SITE_URL が未設定です`）
              → `gh variable set SITE_URL --body https://imotech.<サブドメイン>.workers.dev`。
              Markdown は main に入っているので、直して `gh workflow run publish.yml`
            - **デプロイが失敗した**（`CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID`）
              → `gh secret list` で更新日を確認する。トークンの権限は
              「Edit Cloudflare Workers」。**直したら `gh workflow run publish.yml` で
              再実行する**（手動実行のときは commit が無くてもデプロイする）
            - **「Notion を Published に進める」ステップだけが失敗した**
              → Markdown は main に入り、サイトも更新されている。Notion 側の
              `Status` が `Approved` のまま残るだけで、次回の実行が進める
            - **timeout（10 分）またはキャンセル**
              → 原因は 2 つありうる。どのステップで止まったかで見分ける。
              - 「承認された記事を反映する」か「Notion を Published に進める」で止まった
                → 承認が大量に溜まっている。Notion のレート制限で 1 件あたり数百 ms かかる。
                ログの件数を見て、Notion 側で一部を `Draft` に戻して分割する
              - 「サイトをビルドする」で止まった → 公開記事が増えてビルドが長くなっている。
                アイキャッチ（OG 画像）は公開記事 1 本につき約 0.3 秒かかり、毎回すべて描き直す。
                公開記事が約 1,500 本を超えると 10 分に近づく。
                `.scratch/pipeline/M12-og-cache.md`（差分だけ描く）に着手する
