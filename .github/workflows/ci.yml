name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへの連続 push で古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: パイプライン
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をロックファイル通りに入れる
        run: uv sync --frozen

      # 実行順は docs/DESIGN.md と references/code.md に合わせる。
      # 前の工程が落ちたら後続を読む意味がないので、順に止める。
      - name: フォーマット
        run: uv run ruff format --check .

      - name: 静的解析
        run: uv run ruff check .

      - name: テスト
        run: uv run pytest -q

  site:
    name: サイト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          # site/package.json の engines に合わせる。22.18 が下限なのは、
          # `npm test` が .ts を直接 `node --test` に渡しており、型ストリッピングが
          # デフォルト有効になった版（v22.18.0 / v23.6.0）でないと
          # ERR_UNKNOWN_FILE_EXTENSION で落ちるため
          # https://nodejs.org/api/typescript.html
          node-version: "22.18"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 依存をロックファイル通りに入れる
        run: npm ci

      # 公開ゲートのテスト。ここが壊れると imo 未記入の記事が公開される
      - name: ゲートのテスト
        run: npm test

      - name: 型チェック
        run: npm run check

      - name: ビルド
        # CI では SITE_URL が必須（未設定だと localhost の URL が sitemap と RSS に入る）。
        # ドメイン確定までは仮の値を入れて、ガードが効いていることも同時に確かめる。
        run: npm run build
        env:
          SITE_URL: https://example.invalid

      # imo 未記入の記事がビルド出力に混ざっていないことを、成果物そのもので確かめる。
      # ゲートの単体テストが通っていても、経路のどこかで漏れれば意味がない。
      #
      # 判定はゲート本体（src/lib/imo.ts の imoOf）を呼ぶ。固定句の grep だけだと、
      # プレースホルダを消して不可視文字だけを書いた記事を取りこぼす
      # （U+200B / U+FEFF などは trim() を通り抜ける）。
      - name: 未記入の記事が出力に含まれないこと
        run: node scripts/check-unpublished.mjs
