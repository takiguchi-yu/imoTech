name: daily

on:
  # 06:17 JST。毎正時を避けているのは、公式に「High load times include the start of
  # every hour」「some queued jobs may be dropped」と明記されているため。
  # ずらしても drop は消えないので、飛ぶ前提の設計にしてある（docs/DESIGN.md 5.5）
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

# commit / push に contents、Issue 起票に issues、
# 失敗したステップ名を実行の記録から読むのに actions を使う
permissions:
  contents: write
  issues: write
  actions: read

# 前の実行を殺さない。候補ストアを書いている途中で止めると、
# 状態だけ進んで記事が無い候補が残る
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  pipeline:
    name: 収集と生成
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # shallow clone のまま rebase すると unshallow が要る場面があるので、
          # 安全側に振って全履歴を取る。1 日 1 commit なので当面は軽い
          fetch-depth: 0

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をロックファイル通りに入れる
        run: uv sync --frozen

      - name: 候補を収集する
        run: uv run imotech collect

      # 終了コードの意味は src/imotech/cli.py の cmd_compose 末尾を参照。
      # 部分的な失敗は 0 で返り、次回の実行が pending を拾う。
      # 非 0 になるのは人が直すまで回復しない失敗だけ
      - name: 下書きを生成する
        run: uv run imotech compose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      # compose は候補ストアと記事 Markdown の両方を書く。Markdown を残して
      # おかないと、次回の `git pull --rebase` が未コミット変更で止まる。
      # imo 未記入の記事はサイト側のゲートが公開から除外する
      # （site/src/lib/imo.ts と site/scripts/check-unpublished.mjs）
      - name: 更新を commit して push する
        run: |
          set -euo pipefail

          # 41898282 は github-actions[bot] のユーザー ID
          # （`gh api /users/github-actions%5Bbot%5D` で確認）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/candidates.jsonl site/src/content/articles

          # 熟成待ちで何も変わらない日がある。変更が無いのは失敗ではない
          if git diff --cached --quiet; then
            echo "更新はありません"
            exit 0
          fi

          # 実行は 06:17 JST。UTC で打つと毎回前日の日付になる
          git commit -m "chore: update candidates ($(TZ=Asia/Tokyo date '+%Y-%m-%d'))"

          # publish.yml が同時に site/ を触りうるので、push 前に取り込む。
          # 取り込んだ直後にさらに push が入ることもあるので数回試す
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase が競合しました。ローカルで解決してから push し直してください"
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push が弾かれました。取り込み直します（${attempt} 回目）"
          done
          echo "::error::3 回試しても push できませんでした"
          exit 1

      # timeout（20 分）や手動キャンセルでは failure() は真にならない。
      # cancelled() は「ワークフローがキャンセルされたら true」
      # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions
      - name: 失敗を通知する
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          causes: |
            上から順に疑う。ログの stderr に、どれに当たったかが出ている。

            - **`GEMINI_API_KEY` が未設定か失効**（ログに「GEMINI_API_KEY が未設定です」／終了コード 2）
              → `gh secret list` で更新日を見て `gh secret set GEMINI_API_KEY`
            - **Gemini が全滅**（ログに「記事化できたものがありません」）
              → キーの失効か無料枠切れ。429 が続くなら、このワークフローの compose ステップの
              `env` に `IMOTECH_MAX_DRAFTS_PER_RUN: 3` を足して本数を下げる
            - **Notion を開けない**（ログに「Notion を使う設定なのに開けませんでした」）
              → `NOTION_DATABASE_ID` の誤り、トークン失効、インテグレーションが DB に未接続。
              Markdown は書けているので、急ぐなら `## imo` に直接書けば公開できる
            - **Notion のブロック上限**（Free は生涯 1,000 ブロック）
              → 課金するか、以降は Markdown に直接書く運用に切り替える
            - **`git pull --rebase` が競合**
              → `publish.yml` と同じ記事ファイルを同時に触った。`git pull --rebase` で解決して
              から `gh workflow run daily.yml`
            - **timeout（20 分）またはキャンセル**
              → pending が育ちすぎている。`uv run imotech stats` で件数を見て、compose ステップの
              `env` に `IMOTECH_MAX_PROBES_PER_RUN` を足して絞る
